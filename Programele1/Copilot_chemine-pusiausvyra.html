<!DOCTYPE html><html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cheminė pusiausvyra</title><style>body{font-family:Arial,sans-serif;background:#eef5ff;margin:0;color:#222}header{background:#1565c0;color:#fff;padding:20px;text-align:center}section{background:#fff;margin:15px;padding:20px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}button{background:#1565c0;color:#fff;border:none;padding:10px 15px;border-radius:8px}input[type=number]{padding:8px}</style></head><body><header><h1>Cheminė pusiausvyra</h1><p>Interaktyvus pasiruošimas VBE</p></header><section><h2>Teorija</h2><ul><li>Dinaminė pusiausvyra</li><li>Pusiausvyros konstanta K</li><li>Le Šateljė principas</li><li>Katalizatoriaus poveikis</li></ul></section><section><h2>Testas</h2><div id="quiz"></div><button onclick="checkQuiz()">Patikrinti</button><p id="res"></p></section><section><h2>K skaičiuoklė</h2><input id="c" type="number" step="0.01" placeholder="[C]"><input id="a" type="number" step="0.01" placeholder="[A]"><input id="b" type="number" step="0.01" placeholder="[B]"><button onclick="calcK()">Skaičiuoti</button><p id="k"></p></section><script>const qs=[{q:'Cheminė pusiausvyra?',a:1,o:['Reakcija sustoja','Greičiai lygūs']},{q:'Katalizatorius',a:1,o:['Keičia K','Greitina pasiekimą']}];let h='';qs.forEach((x,i)=>{h+='<p>'+x.q+'</p>';x.o.forEach((o,j)=>h+=`<label><input type=radio name=q${i} value=${j}>${o}</label><br>`)});quiz.innerHTML=h;function checkQuiz(){let s=0;qs.forEach((q,i)=>{let r=document.querySelector('input[name=q'+i+']:checked');if(r&&+r.value===q.a)s++;});res.innerText='Rezultatas '+s+'/'+qs.length;}function calcK(){let c=parseFloat(document.getElementById('c').value),a=parseFloat(document.getElementById('a').value),b=parseFloat(document.getElementById('b').value);document.getElementById('k').innerText=(a>0&&b>0)?('K='+ (c/(a*b)).toFixed(3)):'Neteisingi duomenys';}</script></body></html>
